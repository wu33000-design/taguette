steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, contrib/cloud-run/Dockerfile, -t,
           '${_REGION}-docker.pkg.dev/$PROJECT_ID/taguette/web:${_TAG}', '.']
  - name: gcr.io/cloud-builders/docker
    args: [build, -f, contrib/cloud-run/Dockerfile.backup, -t,
           '${_REGION}-docker.pkg.dev/$PROJECT_ID/taguette/backup:${_TAG}', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/taguette/web:${_TAG}'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/taguette/backup:${_TAG}'
substitutions:
  _REGION: asia-east1
  _TAG: manual
timeout: 1800s
